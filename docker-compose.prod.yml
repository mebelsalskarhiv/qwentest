version: '3.8'

# Production Docker Compose with Caddy for SSL and Multitenancy
# Single entry point on port 80/443 with automatic Let's Encrypt

services:
  # Caddy - Reverse Proxy with Automatic SSL
  caddy:
    image: caddy:2-alpine
    container_name: virtuoso-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - virtuoso-network
    depends_on:
      - backend
      - frontend
    environment:
      - VIRTUOSO_DOMAIN=${VIRTUOSO_DOMAIN:-virtuoso-mes.local}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@virtuoso-mes.local}

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: virtuoso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virtuoso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_production_password}
      POSTGRES_DB: ${POSTGRES_DB:-virtuoso_mes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - virtuoso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-virtuoso}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: virtuoso-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-virtuoso}:${POSTGRES_PASSWORD:-changeme_production_password}@postgres:5432/${POSTGRES_DB:-virtuoso_mes}
      SECRET_KEY: ${SECRET_KEY:-change_this_super_secret_key_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      BASE_DOMAIN: ${VIRTUOSO_DOMAIN:-virtuoso-mes.local}
    volumes:
      - ./backend:/app
    networks:
      - virtuoso-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_BASE_DOMAIN: ${VIRTUOSO_DOMAIN:-virtuoso-mes.local}
    container_name: virtuoso-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_BASE_DOMAIN: ${VIRTUOSO_DOMAIN:-virtuoso-mes.local}
    networks:
      - virtuoso-network
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  virtuoso-network:
    driver: bridge
